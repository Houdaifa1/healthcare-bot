name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest image
            docker pull ghcr.io/${{ github.repository }}:latest

            # Stop and remove old container
            docker stop healthcare-bot || true
            docker rm healthcare-bot || true

            # Start new container
            docker run -d \
              --name healthcare-bot \
              --restart unless-stopped \
              --network host \
              -e NODE_ENV=production \
              -e PORT=3000 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e REDIS_URL="${{ secrets.REDIS_URL }}" \
              -e META_VERIFY_TOKEN="${{ secrets.META_VERIFY_TOKEN }}" \
              -e META_ACCESS_TOKEN="${{ secrets.META_ACCESS_TOKEN }}" \
              -e META_PHONE_NUMBER_ID="${{ secrets.META_PHONE_NUMBER_ID }}" \
              -e META_APP_SECRET="${{ secrets.META_APP_SECRET }}" \
              -e BOSS_PHONE_NUMBER="${{ secrets.BOSS_PHONE_NUMBER }}" \
              -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e SEED_ADMIN_EMAIL="${{ secrets.SEED_ADMIN_EMAIL }}" \
              -e SEED_ADMIN_PASSWORD="${{ secrets.SEED_ADMIN_PASSWORD }}" \
              ghcr.io/${{ github.repository }}:latest

            # Clean up old images
            docker image prune -f

            # Wait and verify
            sleep 10
            docker ps | grep healthcare-bot && echo "✅ Deployment successful" || echo "❌ Container not running"