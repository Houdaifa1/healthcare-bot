name: Deploy to Production

on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: self-hosted
    env:
      DOCKER_BUILDKIT: "0"
      COMPOSE_DOCKER_CLI_BUILD: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Link local secrets and credentials
        run: |
          REPO="$HOME/projects/healthcare-bot"

          for f in ".env.production" ".env"; do
            SOURCE="$REPO/$f"
            if [ ! -f "$SOURCE" ]; then
              echo "❌ $SOURCE not found — deploy cannot continue."
              exit 1
            fi
            ln -sf "$SOURCE" "$f"
            echo "✅ Linked $f"
          done

          CREDS_SOURCE="$REPO/cloudflared/creds.json"
          if [ ! -f "$CREDS_SOURCE" ]; then
            echo "❌ $CREDS_SOURCE not found — deploy cannot continue."
            exit 1
          fi
          mkdir -p cloudflared
          cp -f "$CREDS_SOURCE" cloudflared/creds.json
          echo "✅ Copied cloudflared/creds.json"

      - name: Build backend image (classic builder, bypass compose)
        run: DOCKER_BUILDKIT=0 docker build -t healthcare-bot-backend:latest .

      - name: Ensure Postgres and Redis are up
        run: docker compose up -d postgres redis

      - name: Run migrations
        run: docker compose run --rm backend sh -c "npx prisma migrate deploy"

      - name: Seed database
        run: docker compose run --rm backend sh -c "node dist/src/platform/database/seed.js"

      - name: Deploy backend + tunnel
        run: docker compose up -d backend cloudflared

      - name: Prune old images
        run: docker image prune -f

      - name: Verify deployment
        run: |
          for attempt in $(seq 1 24); do
            status=$(docker inspect --format '{{.State.Health.Status}}' healthcare-bot 2>/dev/null || true)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 5
          done
          docker logs healthcare-bot --tail 50
          exit 1
