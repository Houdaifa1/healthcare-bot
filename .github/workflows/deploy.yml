name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, macbook-prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Link production env file
        run: |
          ENV_SOURCE="$HOME/projects/healthcare-bot/.env.production"
          if [ ! -f "$ENV_SOURCE" ]; then
            echo "❌ $ENV_SOURCE not found — deploy cannot continue."
            exit 1
          fi
          ln -sf "$ENV_SOURCE" .env.production
          echo "✅ Linked .env.production from $ENV_SOURCE"

      - name: Verify .env.production exists
        run: |
          if [ ! -f .env.production ]; then
            echo "❌ .env.production not found on this machine — deploy cannot continue."
            exit 1
          fi
          echo "✅ .env.production found"

      - name: Use non-interactive Docker config
        run: |
          ISOLATED_HOME="$RUNNER_TEMP/docker-home"
          mkdir -p "$ISOLATED_HOME/.docker"
          cat > "$ISOLATED_HOME/.docker/config.json" <<'EOF'
          {
            "auths": {}
          }
          EOF
          echo "HOME=$ISOLATED_HOME" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$ISOLATED_HOME/.docker" >> "$GITHUB_ENV"
          echo "DOCKER_BUILDKIT=0" >> "$GITHUB_ENV"
          echo "COMPOSE_DOCKER_CLI_BUILD=0" >> "$GITHUB_ENV"
          echo "✅ Using isolated home and Docker config without keychain credential helpers"

      - name: Detect Docker Compose command
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo 'COMPOSE_CMD=docker compose' >> "$GITHUB_ENV"
            echo "✅ Using Docker Compose v2 command: docker compose"
          elif docker-compose version >/dev/null 2>&1; then
            echo 'COMPOSE_CMD=docker-compose' >> "$GITHUB_ENV"
            echo "✅ Using legacy Docker Compose command: docker-compose"
          else
            echo "❌ Neither 'docker compose' nor 'docker-compose' is available on this runner."
            exit 1
          fi

      - name: Build backend image
        run: $COMPOSE_CMD build backend

      - name: Ensure Postgres and Redis are up
        run: $COMPOSE_CMD up -d postgres redis

      - name: Resolve stuck migrations
        run: |
          $COMPOSE_CMD run --rm backend sh -c "
            set -e
            FAILED=\$(npx prisma migrate status 2>&1 | grep 'Following migration' -A 999 | grep '^\s*[0-9]' | awk '{print \$1}' || true)
            if [ -n \"\$FAILED\" ]; then
              for m in \$FAILED; do npx prisma migrate resolve --rolled-back \"\$m\" || true; done
            fi
          "

      - name: Run migrations
        run: $COMPOSE_CMD run --rm backend sh -c "npx prisma migrate deploy"

      - name: Seed database
        run: $COMPOSE_CMD run --rm backend sh -c "node dist/src/prisma/seed.js"

      - name: Deploy backend + tunnel
        run: $COMPOSE_CMD up -d backend cloudflared

      - name: Prune old images
        run: docker image prune -f

      - name: Verify deployment
        run: |
          sleep 10
          if docker ps --filter "name=healthcare-bot" --filter "status=running" | grep -q healthcare-bot; then
            echo "✅ Deployment successful"
          else
            echo "❌ Container not running — last 50 log lines:"
            docker logs healthcare-bot --tail 50
            exit 1
          fi
          docker logs healthcare-bot --tail 20