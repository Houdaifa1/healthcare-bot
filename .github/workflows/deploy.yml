name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase repo name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:latest

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail

            IMAGE="ghcr.io/${{ steps.repo.outputs.name }}:latest"
            ENV_FILE="/root/.env.production"

            # ── Ensure Redis ──────────────────────────────────────────────
            if ! command -v redis-server &> /dev/null; then
              apt-get update -qq && apt-get install -y redis-server
              sed -i 's/^bind .*/bind 127.0.0.1/' /etc/redis/redis.conf
              systemctl enable redis-server
            fi
            systemctl start redis-server || true
            redis-cli ping | grep -q PONG && echo "✅ Redis is up" || { echo "❌ Redis failed"; exit 1; }

            # ── Pull latest image ─────────────────────────────────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"

            # ── Resolve any stuck/failed migrations via Prisma CLI ────────
            # This reads _prisma_migrations and marks failed ones as rolled-back
            # so migrate deploy can re-apply them cleanly.
            echo "▶ Resolving any stuck migrations..."
            docker run --rm \
              --network host \
              --env-file "$ENV_FILE" \
              "$IMAGE" \
              sh -c "
                set -e
                # Get names of failed migrations (finished_at IS NULL means failed/stuck)
                FAILED=\$(npx prisma migrate status 2>&1 | grep 'Following migration' -A 999 | grep '^\s*[0-9]' | awk '{print \$1}' || true)
                if [ -n \"\$FAILED\" ]; then
                  echo \"Found stuck migrations: \$FAILED\"
                  for m in \$FAILED; do
                    echo \"Marking \$m as rolled back...\"
                    npx prisma migrate resolve --rolled-back \"\$m\" || true
                  done
                  echo '✅ Stuck migrations resolved'
                else
                  echo '✅ No stuck migrations'
                fi
              "

            # ── Run migrations BEFORE swapping the container ──────────────
            echo "▶ Running prisma migrate deploy..."
            docker run --rm \
              --network host \
              --env-file "$ENV_FILE" \
              "$IMAGE" \
              sh -c "npx prisma migrate deploy"
            echo "✅ Migrations applied"

            # ── Flush session keys ────────────────────────────────────────
            SESSION_KEYS=$(redis-cli --scan --pattern "session:*" 2>/dev/null | wc -l || echo "0")
            if [ "$SESSION_KEYS" -gt "0" ]; then
              redis-cli --scan --pattern "session:*" | xargs -r redis-cli UNLINK
              echo "✅ Flushed $SESSION_KEYS Redis session key(s)"
            else
              echo "✅ No session keys to flush"
            fi

            # ── Swap container ────────────────────────────────────────────
            docker stop healthcare-bot 2>/dev/null || true
            docker rm healthcare-bot 2>/dev/null || true
            docker run -d \
              --name healthcare-bot \
              --restart unless-stopped \
              --network host \
              --env-file "$ENV_FILE" \
              "$IMAGE"

            docker image prune -f

            # ── Verify ────────────────────────────────────────────────────
            echo "▶ Waiting for container to start..."
            sleep 10
            if docker ps | grep -q healthcare-bot; then
              echo "✅ Deployment successful"
            else
              echo "❌ Container not running"
              docker logs healthcare-bot --tail 50
              exit 1
            fi
            docker logs healthcare-bot --tail 20