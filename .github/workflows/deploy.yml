name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, macbook-prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Link production env file
        run: |
          ENV_SOURCE="$HOME/projects/healthcare-bot/.env.production"
          if [ ! -f "$ENV_SOURCE" ]; then
            echo "❌ $ENV_SOURCE not found — deploy cannot continue."
            exit 1
          fi
          ln -sf "$ENV_SOURCE" .env.production
          echo "✅ Linked .env.production from $ENV_SOURCE"

      - name: Verify .env.production exists
        run: |
          if [ ! -f .env.production ]; then
            echo "❌ .env.production not found on this machine — deploy cannot continue."
            exit 1
          fi
          echo "✅ .env.production found"

      - name: Configure Docker for headless runner
        run: |
          DOCKER_CONFIG_DIR="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG_DIR"
          printf '{"auths":{}}' > "$DOCKER_CONFIG_DIR/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG_DIR" >> "$GITHUB_ENV"

      - name: Build backend image
        run: docker compose build backend

      - name: Ensure Postgres and Redis are up
        run: docker compose up -d postgres redis

      - name: Resolve stuck migrations
        run: |
          docker compose run --rm backend sh -c "
            set -e
            FAILED=\$(npx prisma migrate status 2>&1 | grep 'Following migration' -A 999 | grep '^\s*[0-9]' | awk '{print \$1}' || true)
            if [ -n \"\$FAILED\" ]; then
              for m in \$FAILED; do npx prisma migrate resolve --rolled-back \"\$m\" || true; done
            fi
          "

      - name: Run migrations
        run: docker compose run --rm backend sh -c "npx prisma migrate deploy"

      - name: Seed database
        run: docker compose run --rm backend sh -c "node dist/src/prisma/seed.js"

      - name: Deploy backend + tunnel
        run: docker compose up -d backend cloudflared

      - name: Prune old images
        run: docker image prune -f

      - name: Verify deployment
        run: |
          sleep 10
          if docker ps --filter "name=healthcare-bot" --filter "status=running" | grep -q healthcare-bot; then
            echo "✅ Deployment successful"
          else
            echo "❌ Container not running — last 50 log lines:"
            docker logs healthcare-bot --tail 50
            exit 1
          fi
          docker logs healthcare-bot --tail 20