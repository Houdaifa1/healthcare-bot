name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase repo name
        id: repo
        run: echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e

            # ── Ensure Redis is installed and running ─────────────────────
            if ! command -v redis-server &> /dev/null; then
              echo "Installing Redis..."
              apt-get update -qq
              apt-get install -y redis-server
              sed -i 's/^bind .*/bind 127.0.0.1/' /etc/redis/redis.conf
              systemctl enable redis-server
            fi
            systemctl start redis-server || true
            redis-cli ping | grep -q PONG && echo "✅ Redis is up" || echo "❌ Redis failed to start"

            # ── Pull and redeploy container ───────────────────────────────
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ steps.repo.outputs.name }}:latest
            docker stop healthcare-bot || true
            docker rm healthcare-bot || true
            docker run -d \
              --name healthcare-bot \
              --restart unless-stopped \
              --network host \
              --env-file /root/.env.production \
              ghcr.io/${{ steps.repo.outputs.name }}:latest

            # ── Run Prisma migrations ─────────────────────────────────
            docker exec healthcare-bot npx prisma migrate deploy

            docker image prune -f

            sleep 10
            docker ps | grep healthcare-bot && echo "✅ Deployment successful" || echo "❌ Container not running"
            docker logs healthcare-bot --tail 20