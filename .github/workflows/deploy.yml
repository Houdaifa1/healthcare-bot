name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, macbook-prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Link local secrets and credentials
        run: |
          REPO="$HOME/projects/healthcare-bot"

          for f in ".env.production" ".env" "cloudflared/creds.json"; do
            SOURCE="$REPO/$f"
            if [ ! -f "$SOURCE" ]; then
              echo "❌ $SOURCE not found — deploy cannot continue."
              exit 1
            fi
            mkdir -p "$(dirname "$f")"
            ln -sf "$SOURCE" "$f"
            echo "✅ Linked $f"
          done

      - name: Use non-interactive Docker config
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          cat > "$RUNNER_TEMP/docker-config/config.json" <<'EOF'
          {
            "auths": {}
          }
          EOF
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          echo "✅ Using temporary Docker config without keychain credential helpers"

      - name: Build backend image
        run: docker compose build backend

      - name: Ensure Postgres and Redis are up
        run: docker compose up -d postgres redis

      - name: Resolve stuck migrations
        run: |
          docker compose run --rm backend sh -c "
            set -e
            FAILED=\$(npx prisma migrate status 2>&1 | grep 'Following migration' -A 999 | grep '^\s*[0-9]' | awk '{print \$1}' || true)
            if [ -n \"\$FAILED\" ]; then
              for m in \$FAILED; do npx prisma migrate resolve --rolled-back \"\$m\" || true; done
            fi
          "

      - name: Run migrations
        run: docker compose run --rm backend sh -c "npx prisma migrate deploy"

      - name: Seed database
        run: docker compose run --rm backend sh -c "node dist/src/prisma/seed.js"

      - name: Deploy backend + tunnel
        run: docker compose up -d backend cloudflared

      - name: Prune old images
        run: docker image prune -f

      - name: Verify deployment
        run: |
          sleep 10
          if docker ps --filter "name=healthcare-bot" --filter "status=running" | grep -q healthcare-bot; then
            echo "✅ Deployment successful"
          else
            echo "❌ Container not running — last 50 log lines:"
            docker logs healthcare-bot --tail 50
            exit 1
          fi
          docker logs healthcare-bot --tail 20